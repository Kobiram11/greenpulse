services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MQTT_CA_PATH: /app/certs/AmazonRootCA1.pem
      MQTT_CERT_PATH: /app/certs/backend-certificate.pem.crt
      MQTT_KEY_PATH: /app/certs/backend-private.pem.key
      SPOOL_PATH: /app/data/spool.db
    volumes:
      - ./certs:/app/certs:ro
      - backend-data:/app/data
    # Linux EC2: host networking lets the default AWS SDK chain use the EC2 instance role.
    network_mode: host
  node-red:
    build: ./node-red
    restart: unless-stopped
    environment:
      AWS_IOT_ENDPOINT: ${AWS_IOT_ENDPOINT:?Set AWS_IOT_ENDPOINT in backend/.env}
      DEVICE_ID: ${DEVICE_ID:?Set DEVICE_ID in backend/.env}
      NODE_RED_CLIENT_ID: greenpulse-dashboard
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - node-red-data:/data
      - ./certs:/data/certs:ro
volumes:
  backend-data:
  node-red-data:
