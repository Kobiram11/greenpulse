AWSTemplateFormatVersion: '2010-09-09'
Description: GreenPulse timestamped sensor and care-event storage
Parameters:
  TableName:
    Type: String
    Default: GreenPulseEvents
Resources:
  Events:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
Outputs:
  TableArn:
    Value: !GetAtt Events.Arn
